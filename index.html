<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Take3 Digital · Social</title><script src="portfolio.js"></script></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600&display=swap">
<style>
/* Layout: 1600x900 stage scaled to viewport. Single dark look from the Take3 reference deck: deep teal ground, orange + yellow accents, orange→yellow gradient for the one key element per screen. */
:root{
  --bg:#043a47; --bg2:#054250; --panel:#0a4c5b; --panel2:#0d5666;
  --fg:#f1f3ee; --muted:#b9cdd1; --dim:#7fa3aa; --line:rgba(241,243,238,.14); --line2:rgba(241,243,238,.28);
  --orange:#ff6700; --orange2:#ff8a1f; --yellow:#fdbd10; --red:#ff0808;
  --grad:linear-gradient(135deg,#ff6700 0%,#fdbd10 100%);
  --grad2:linear-gradient(135deg,#ff0808 0%,#ff6700 50%,#fdbd10 100%);
  --ink:#032a34;
  --font:'Poppins','Segoe UI',Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
img{max-width:100%}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#wrap{position:fixed;inset:0;display:grid;place-items:center;z-index:1;padding-inline:16px;padding-block:0}
#stage{width:1600px;height:900px;position:relative;transform-origin:center;overflow:hidden;border-radius:16px;background:var(--bg);box-shadow:0 30px 80px rgba(0,0,0,.45)}
.slide{position:absolute;inset:0;padding:84px 96px 72px;display:flex;flex-direction:column;opacity:0;visibility:hidden;pointer-events:none;background:var(--bg)}
.slide.grad{background:linear-gradient(135deg,#fdbd10 0%,#ff6700 48%,#ff0808 100%);color:var(--ink)}
.slide.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .5s ease}
.slide.out{opacity:0;visibility:visible;transform:scale(.985);transition:opacity .4s ease,transform .4s ease}
.squircle{position:absolute;border:1.5px solid rgba(241,243,238,.14);border-radius:28%;pointer-events:none}
.sphere{position:absolute;border-radius:50%;background:linear-gradient(135deg,#ff0808 0%,#ff6700 50%,#fdbd10 100%);box-shadow:0 40px 90px rgba(255,103,0,.35);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;pointer-events:none}

/* chrome */
.top{position:absolute;left:96px;right:96px;top:30px;display:flex;align-items:center;justify-content:space-between;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);font-weight:600}
.top .cur{color:var(--orange)}
.grad .top{color:rgba(3,42,52,.6)}.grad .top .cur{color:var(--ink)}
.foot{position:absolute;left:96px;right:96px;bottom:28px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);font-weight:500}
.grad .foot{color:rgba(3,42,52,.7)}
#progress{position:absolute;left:0;top:0;height:4px;background:var(--grad);width:0;transition:width .5s cubic-bezier(.2,.8,.2,1);z-index:5;box-shadow:0 0 16px rgba(255,103,0,.7)}
#count{position:absolute;right:96px;top:28px;font-weight:600;font-size:12px;letter-spacing:.2em;z-index:4;font-variant-numeric:tabular-nums;color:var(--dim)}
#count.dk{color:rgba(3,42,52,.7)}
#nav{position:fixed;right:22px;bottom:22px;display:flex;gap:8px;z-index:6}
#nav button,#menuBtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line2);background:var(--panel);color:var(--fg);font-size:20px;cursor:pointer;transition:transform .2s,background .2s;font-family:var(--font);font-weight:700}
#nav button:hover,#menuBtn:hover{transform:translateY(-2px);background:var(--panel2)}
#nav button:focus-visible,#menuBtn:focus-visible,.pillar:focus-visible,.x li:focus-visible,.chip:focus-visible,.cta:focus-visible,#menu button:focus-visible,.card[tabindex]:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
#menuBtn{position:fixed;left:22px;bottom:22px;z-index:6;font-size:16px}
#menu[hidden]{display:none}
#menu{position:fixed;left:22px;bottom:80px;z-index:7;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:10px;display:grid;gap:2px;max-height:70vh;overflow:auto;min-width:270px}
#menu button{border:0;background:none;text-align:left;padding:8px 12px;border-radius:8px;cursor:pointer;font-family:var(--font);font-size:13px;color:var(--fg);display:flex;gap:10px;align-items:center}
#menu button:hover{background:var(--panel2)}
#menu button.cur{background:var(--orange);color:var(--ink)}
#menu button i{font-style:normal;font-weight:700;font-size:10px;letter-spacing:.1em;color:var(--dim);width:22px}
#menu button.cur i{color:var(--ink)}
#hint{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);font-size:12px;color:var(--dim);letter-spacing:.1em;z-index:6;transition:opacity .6s}
#hint.gone{opacity:0}

/* wordmark */
.wm{font-weight:800;letter-spacing:-.05em;line-height:1;display:inline-block;position:relative;color:var(--fg);padding-right:.26em}
.wm i{position:absolute;right:0;top:-.02em;width:.2em;height:.2em;border-radius:50%;background:var(--grad2);box-shadow:0 0 .25em rgba(255,103,0,.6);animation:pulse 2.6s ease-in-out infinite}
.grad .wm{color:var(--ink)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.rule{width:150px;height:5px;border-radius:3px;background:var(--grad2)}
.grad .rule{background:var(--ink)}

/* type */
.eyebrow{font-size:14px;letter-spacing:.34em;text-transform:uppercase;color:var(--orange);font-weight:700;margin:0 0 18px}
.eyebrow.y{color:var(--yellow)}
.grad .eyebrow{color:var(--ink)}
h1,h2{margin:0;text-wrap:balance;letter-spacing:-.03em;line-height:1.02;font-weight:800}
h1{font-size:88px}h2{font-size:68px}
.o{color:var(--orange)}.y{color:var(--yellow)}
.grad h2{color:var(--ink)}
.lead{font-size:23px;line-height:1.5;color:var(--muted);max-width:820px;margin:20px 0 0;font-weight:400}
.lead b{color:var(--fg);font-weight:600}.lead em{font-style:italic;color:var(--fg)}
.grad .lead{color:rgba(3,42,52,.8)}.grad .lead b{color:var(--ink)}
.row{display:flex;gap:24px}.grow{flex:1;min-width:0}
.cols{display:grid;gap:22px}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}.c5{grid-template-columns:repeat(5,1fr)}
.mt{margin-top:auto}
.tagline{font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:var(--orange);font-weight:700}
.cover-client{font-weight:800;font-size:36px;letter-spacing:.02em;color:var(--yellow);padding:4px 14px;border-radius:10px;outline:none;cursor:text;min-width:260px;border:1.5px dashed transparent;transition:border-color .3s}
.cover-client{cursor:default}
.edit-hint{margin-top:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);transition:opacity .3s}
.cover-client:not(:focus):not(:hover)~.edit-hint{opacity:0}
.ag{display:grid;grid-template-columns:46px 1fr 24px;align-items:center;gap:18px;padding:16px 22px;border:1px solid var(--line2);border-radius:16px;background:transparent;color:inherit;font-family:inherit;text-align:left;cursor:pointer;min-width:0;transition:transform .25s,border-color .25s,background .25s}
.ag:hover{transform:translateY(-3px);border-color:var(--orange);background:var(--panel)}
.ag .n{width:44px;height:44px;border-radius:50%;background:var(--orange);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:15px}
.ag .tx{min-width:0}.ag b{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em}
.ag small{display:block;font-size:15px;color:var(--muted);margin-top:3px;line-height:1.4}
.ag i{font-style:normal;color:var(--orange);font-size:20px;text-align:right}
.mission{font-weight:700;font-size:34px;color:var(--yellow);letter-spacing:-.01em}
.mission em{font-style:normal;color:var(--yellow)}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 28px;position:relative;min-width:0;transition:transform .25s,border-color .25s,background .25s;text-align:left;font-family:inherit;color:inherit;overflow:hidden}
.card.topline::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--orange)}
.card.lift{cursor:pointer}
.card.lift:hover{transform:translateY(-4px);border-color:var(--line2);background:var(--panel2)}
.card.outline{background:transparent;border-color:var(--line2)}
.card.hot{background:var(--grad);color:var(--ink);border-color:transparent}
.card.hot p,.card.hot .tag,.card.hot h3,.card.hot .num,.card.hot .more{color:var(--ink)}
.card.hot .tag{color:#4a1e00}
.card .num{font-weight:400;font-size:42px;color:var(--orange);line-height:1}
.card h3{font-weight:700;font-size:19px;letter-spacing:.06em;text-transform:uppercase;margin:12px 0 8px;color:var(--fg)}
.card h3.n{text-transform:none;letter-spacing:-.01em;font-size:26px}
.card p{margin:0;color:var(--muted);font-size:16px;line-height:1.5}
.card p.o{color:var(--orange);font-style:italic}
.card .tag{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--orange);font-weight:700}
.card .more{font-size:14px;line-height:1.5;color:var(--muted);max-height:0;overflow:hidden;transition:max-height .4s ease,margin .4s,padding .4s;margin:0;border-top:1px solid transparent}
.card.open .more{max-height:170px;margin-top:12px;padding-top:10px;border-top-color:var(--line)}
.card.hot.open .more{border-top-color:rgba(3,42,52,.25)}
.card .hintc{position:absolute;right:16px;top:16px;width:26px;height:26px;border-radius:50%;background:rgba(241,243,238,.1);display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--yellow);transition:transform .3s}
.card.hot .hintc{background:rgba(3,42,52,.15);color:var(--ink)}
.card.open .hintc{transform:rotate(45deg)}
.chip{display:block;border-radius:999px;padding:14px 28px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:17px;background:var(--panel);border:1px solid var(--line2);transition:transform .2s,background .2s,border-color .2s;cursor:pointer;position:relative;text-align:left;width:100%;color:var(--fg);font-family:inherit}
.chip small{display:block;font-weight:400;letter-spacing:0;text-transform:none;font-size:14px;color:var(--muted);margin-top:2px}
.chip em{display:block;font-style:normal;font-weight:400;letter-spacing:0;text-transform:none;font-size:14px;line-height:1.5;max-height:0;overflow:hidden;transition:max-height .4s ease,margin .4s,padding .4s}
.chip.on{background:var(--orange);color:var(--ink);border-color:transparent;border-radius:28px}
.chip.on small{color:#4a1e00}
.chip.on em{max-height:130px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(3,42,52,.25);color:var(--ink)}
.chip::after{content:"+";position:absolute;right:22px;top:14px;font-size:20px;color:var(--dim);transition:transform .3s}
.chip.on::after{transform:rotate(45deg);color:var(--ink)}
.chip:hover{transform:translateX(6px)}
.x{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.x li{border-radius:12px;padding:12px 16px 12px 40px;position:relative;cursor:pointer;border:1px solid transparent;transition:background .2s,border-color .2s}
.x li:hover,.x li.open{background:rgba(241,243,238,.05);border-color:var(--line)}
.x li b{display:block;font-weight:700;font-size:18px;letter-spacing:-.01em;color:var(--fg)}
.x li span{display:block;color:var(--muted);font-size:15px;line-height:1.5;max-height:0;overflow:hidden;transition:max-height .35s ease,margin .35s}
.x li.open span{max-height:120px;margin-top:4px}
.x li::before{content:"→";position:absolute;left:12px;top:11px;color:var(--orange);font-weight:600;transition:transform .3s}
.x li.open::before{transform:translateX(4px);color:var(--yellow)}
.x li::after{content:"+";position:absolute;right:14px;top:10px;font-weight:700;color:var(--dim);transition:transform .3s}
.x li.open::after{transform:rotate(45deg)}
.stat{display:grid;gap:2px}
.stat .v{font-weight:800;font-size:76px;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--fg)}
.stat .v.o{color:var(--orange)}.stat .v.y{color:var(--yellow)}
.stat .v.thin{font-weight:400}
.stat .l{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--orange);font-weight:700;margin-bottom:6px}
.stat .d{color:var(--muted);font-size:17px}
.cta{display:inline-flex;align-items:center;gap:12px;background:var(--grad);color:var(--ink);font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:16px 30px;border-radius:999px;font-size:14px;border:0;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 10px 26px rgba(255,103,0,.3);font-family:inherit}
.cta:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(255,103,0,.4)}
.cta.ghost{background:transparent;color:var(--orange);border:2px solid var(--orange);box-shadow:none}
.grad .cta.ghost{color:var(--ink);border-color:var(--ink)}

/* overview diagram */
.diagram{position:relative;height:400px;margin-top:6px}
.diagram svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.diagram svg path{stroke:var(--orange);stroke-width:2.5;fill:none;opacity:.5;stroke-dasharray:7 7;animation:dash 28s linear infinite}
.diagram svg circle{fill:var(--orange)}
.diagram svg .spark{fill:var(--yellow);filter:drop-shadow(0 0 6px rgba(253,189,16,.9))}
@keyframes dash{to{stroke-dashoffset:-700}}
.pillar{position:absolute;width:300px;background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--orange);border-radius:18px;padding:20px 24px;cursor:pointer;transition:transform .25s,background .25s;text-align:left;font-family:inherit;color:var(--fg)}
.pillar:hover{transform:translateY(-6px);background:var(--panel2)}
.pillar .k{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);font-weight:700}
.pillar h3{font-weight:700;font-size:22px;margin:8px 0 6px;letter-spacing:-.02em;text-transform:uppercase;font-size:18px;letter-spacing:.06em}
.pillar p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.pillar .go{position:absolute;right:18px;top:16px;width:30px;height:30px;border-radius:50%;background:rgba(241,243,238,.08);display:grid;place-items:center;font-weight:700;color:var(--yellow);transition:background .2s,color .2s}
.pillar:hover .go{background:var(--grad);color:var(--ink)}
.pillar.key{background:var(--grad);color:var(--ink);border-top-color:transparent}
.pillar.key .k,.pillar.key p{color:#4a1e00}.pillar.key .go{background:rgba(3,42,52,.15);color:var(--ink)}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:160px;height:160px;border-radius:50%;background:var(--panel2);border:2px solid var(--orange);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;box-shadow:0 0 0 16px rgba(255,103,0,.08),0 0 0 32px rgba(255,103,0,.04);z-index:2}
.hub b{font-size:50px;letter-spacing:-.02em;color:var(--yellow);font-weight:800;line-height:1}
.flow{display:flex;align-items:center;gap:8px;font-weight:700;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.flow span{padding:10px 16px;border-radius:999px;border:1px solid var(--line2)}
.flow span.p{background:var(--orange);color:var(--ink);border-color:transparent}.flow span.h{background:var(--yellow);color:var(--ink);border-color:transparent}
.flow i{font-style:normal;color:var(--dim)}

/* timeline, table, misc */
.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;position:relative;margin-top:50px}
.timeline::before{content:"";position:absolute;left:10%;right:10%;top:30px;height:3px;background:var(--line2);border-radius:2px}
.timeline .fill{position:absolute;left:10%;top:30px;height:3px;background:var(--orange);border-radius:2px;width:0;transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.on .timeline .fill{width:80%}
/* ===== modo retrato: celular em pé (palco 900x1600) ===== */
.retrato #stage{width:620px;height:1100px}
.retrato #wrap{place-items:start center;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.retrato #nav{right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.retrato #menuBtn{left:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.retrato #nav button,.retrato #menuBtn{width:42px;height:42px}
.retrato .slide{padding:78px 30px 40px;overflow-y:auto;overflow-x:hidden}
.retrato .foot{left:30px;right:30px;bottom:24px;font-size:11px;letter-spacing:.14em}
.retrato .slide p,.retrato .slide li,.retrato .slide td,.retrato .slide small{font-size:19px!important;line-height:1.5!important}
.retrato .card h3,.retrato .card .n{font-size:28px!important}
.retrato .tag{font-size:13px!important;letter-spacing:.2em}
.retrato .eyebrow{font-size:13px;letter-spacing:.24em}
.retrato .card{padding:22px 22px!important}
.retrato .cols{gap:14px!important}
.retrato #hint{display:none}
.retrato .top{left:30px;right:30px;top:26px}
.retrato .top .cur{display:none}
.retrato .foot{display:none}
.retrato h2{font-size:48px!important;line-height:1.04}
.retrato .lead{font-size:22px!important;max-width:none!important}
.retrato .cols.c2,.retrato .cols.c3{grid-template-columns:1fr!important}
.retrato .cols.c4,.retrato .cols.c5{grid-template-columns:1fr!important}
.retrato .row{flex-direction:column!important;align-items:stretch!important;gap:22px!important}
.retrato .row>*{width:auto!important;max-width:100%!important;flex:none!important}
.retrato .card{width:auto!important;min-height:0!important}
.retrato .mt{margin-top:28px!important}
.retrato table{font-size:17px}
.retrato .timeline,.retrato .timeline.seis{grid-template-columns:1fr!important;gap:22px!important;margin-top:34px}
.retrato .timeline::before,.retrato .timeline .fill{display:none}
.retrato .timeline .step{display:grid;grid-template-columns:62px 1fr;column-gap:22px;text-align:left;align-items:start}
.retrato .timeline .dot{margin:0;grid-row:1 / span 3}
.retrato .timeline h3{font-size:24px!important;margin:2px 0 4px}
.retrato .timeline p{font-size:17px!important}
.retrato .photo.sede{width:100%!important;max-width:100%!important}
.retrato .photo.sede img{width:100%;height:auto}
.retrato .banner{font-size:22px;padding:22px 26px}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:40px}
.ig a{display:grid;gap:8px;text-decoration:none;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 26px;transition:transform .25s,border-color .25s}
.ig a:hover{transform:translateY(-3px);border-color:var(--orange)}
.ig .h{display:flex;align-items:center;gap:12px;font-weight:700;font-size:22px}
.ig .h i{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;flex:none}
.ig .h i svg{width:22px;height:22px}
.ig p{margin:0;color:var(--muted);font-size:17px;line-height:1.5}
.ig .v{color:var(--orange);font-weight:600;font-size:15px}
.retrato .ig{grid-template-columns:1fr;margin-top:26px}
[data-edit]{outline:none;border-bottom:2px dashed transparent;cursor:text;border-radius:2px;transition:border-color .2s}
[data-edit]:hover,[data-edit]:focus{border-bottom-color:currentColor}
.orc-lista{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:12px}
.orc-lista li{display:flex;gap:12px;align-items:baseline;font-size:20px;line-height:1.45}
.orc-lista li::before{content:"→";color:var(--orange);font-weight:700;flex:none}
.card.hot .orc-lista li::before{color:var(--ink)}
.timeline.seis{grid-template-columns:repeat(6,1fr);gap:14px}.timeline.seis::before,.timeline.seis .fill{left:8.33%}.timeline.seis::before{right:8.33%}.on .timeline.seis .fill{width:83.34%}.timeline.seis h3{font-size:21px}.timeline.seis p{font-size:14.5px}
.timeline .step{text-align:center;position:relative}
.timeline .dot{width:62px;height:62px;border-radius:50%;background:var(--orange);display:grid;place-items:center;margin:0 auto 18px;font-weight:800;font-size:20px;color:var(--ink);position:relative;z-index:1}
.timeline .step.star .dot{background:var(--fg);color:var(--ink);box-shadow:0 0 0 10px rgba(241,243,238,.1)}
.timeline .m{font-size:12px;letter-spacing:.3em;color:var(--orange);font-weight:700;text-transform:uppercase}
.timeline h3{font-size:23px;font-weight:700;margin:6px 0 8px;letter-spacing:-.02em}
.timeline p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
table{width:100%;border-collapse:collapse;font-size:19px}
