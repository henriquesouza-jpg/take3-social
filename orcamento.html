<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Orçamento Take3 Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Página de orçamento: só leitura, celular primeiro, mesma identidade da apresentação. */
:root{
  --bg:#043a47; --panel:#0a4c5b; --fg:#f1f3ee; --muted:#b9cdd1; --dim:#7fa3aa;
  --line:rgba(241,243,238,.14); --orange:#ff6700; --yellow:#fdbd10; --ink:#032a34;
  --grad:linear-gradient(135deg,#ff6700 0%,#fdbd10 100%);
  --font:'Poppins','Segoe UI',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 500px at 110% -10%,rgba(255,103,0,.18),transparent 60%),radial-gradient(700px 500px at -20% 110%,rgba(253,189,16,.10),transparent 60%)}
.wrap{max-width:980px;margin:0 auto;padding-inline:20px;padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:22px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px}
header img{height:34px;width:auto}
.eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--orange);font-weight:700;margin:0}
h1{font-size:clamp(34px,7vw,58px);line-height:1.04;letter-spacing:-.03em;margin:8px 0 0;font-weight:800;text-wrap:balance}
h1 .o{color:var(--orange)}
.selo{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;letter-spacing:.02em;border:1px solid var(--line);background:rgba(0,0,0,.18)}
.selo i{width:8px;height:8px;border-radius:50%;background:#2ee59d;display:inline-block}
.selo.exp i{background:#ff4d4d}
.grade{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:820px){.grade{grid-template-columns:1.1fr 1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 24px;min-width:0}
.card.hot{background:var(--grad);color:var(--ink);border-color:transparent}
.tag{font-size:12px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;color:var(--orange);margin:0}
.hot .tag{color:#4a1e00}
h2{font-size:26px;margin:8px 0 6px;letter-spacing:-.02em;font-weight:700}
ul{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
li{display:flex;gap:10px;align-items:baseline;font-size:17px;line-height:1.45}
li::before{content:"→";color:var(--orange);font-weight:700;flex:none}
.hot li::before{color:var(--ink)}
.valor{font-size:clamp(40px,9vw,60px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums;word-break:break-word}
.periodo{font-size:18px;font-weight:600}
.div{height:1px;background:rgba(3,42,52,.25);margin:18px 0 14px}
.obs{white-space:pre-line;color:var(--muted);font-size:17px;line-height:1.6;margin:10px 0 0}
.validade{font-weight:700;font-size:15px;margin:16px 0 0}
.acoes{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:13px 18px;font:600 15px var(--font);text-decoration:none;color:var(--ink);background:var(--grad)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
footer{color:var(--dim);font-size:12.5px;letter-spacing:.06em;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px}
.aviso{text-align:center;padding:48px 24px}
.aviso h1{font-size:clamp(28px,6vw,42px)}
.aviso p{color:var(--muted);font-size:17px;line-height:1.6;max-width:520px;margin:14px auto 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite">
  <header><img src="assets/logo-take3.svg" alt="Take3 Digital"><span class="selo" id="selo" hidden><i></i><span id="seloTxt"></span></span></header>
  <section class="card aviso" id="carregando"><p>Carregando o orçamento…</p></section>
</main>
<script>
(function(){
  'use strict';
  var SAL = 'take3-social-2026';
  function hash(str){ var h = 0x811c9dc5; for (var i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return ('0000000' + h.toString(16)).slice(-8); }
  function decodificar(p){ var b = p.replace(/-/g,'+').replace(/_/g,'/'); while (b.length % 4) b += '='; var bin = atob(b); var bytes = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return JSON.parse(new TextDecoder().decode(bytes)); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function dataBR(iso){ var p = String(iso || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : ''; }
  function hojeISO(){ var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  var PADRAO = { pl: 'Social · Plano mensal', pe: 'por mês',
    it: ['8 a 12 posts por mês + stories do calendário','1 diária de captação por mês','Direct respondido em até 24h úteis','Reunião mensal com relatório de resultados','Onboarding de 30 dias incluso no mês 01'],
    co: ['Pagamento mensal por PIX ou boleto','Vencimento todo dia 10','Contrato de 6 meses · 2 primeiros de experiência'] };
  var CAMPOS = ['c','pl','it','v','pe','co','o','val','em'];
  function canon(get){ return CAMPOS.map(function(k){ return get(k) || ''; }).join('\u0001'); }
  function isoDe(s){ return /^\d{8}$/.test(s || '') ? s.slice(0,4) + '-' + s.slice(4,6) + '-' + s.slice(6) : (s || ''); }
  function moeda(v){ return /^\d+(\.\d{1,2})?$/.test(v) ? Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }).replace(/\u00a0/g, ' ') : v; }
  var app = document.getElementById('app');
  function aviso(titulo, texto){ document.getElementById('carregando').outerHTML = '<section class="card aviso"><p class="eyebrow">Take3 Digital</p><h1>' + titulo + '</h1><p>' + texto + '</p></section>'; }

  var q = new URLSearchParams(location.search), p = q.get('p') || '', k = q.get('k') || '', d = null;
  try {
    if (p) { if (hash(SAL + p) === k) d = decodificar(p); }            // links antigos (dados completos codificados)
    else if (q.get('c') && hash(SAL + canon(function(x){ return q.get(x); })) === k) {   // link curto
      var sep = function(x){ return x ? x.split('|').map(function(t){ return t.trim(); }).filter(Boolean) : null; };
      d = { c: q.get('c'), pl: q.get('pl') || PADRAO.pl, it: sep(q.get('it')) || PADRAO.it, v: moeda(q.get('v') || ''), pe: q.get('pe') || PADRAO.pe,
            co: sep(q.get('co')) || PADRAO.co, o: q.get('o') || '', val: isoDe(q.get('val')), em: isoDe(q.get('em')) };
    }
  } catch (e) { d = null; }
  if (!d){ aviso('Link de orçamento inválido', 'Este link está incompleto ou foi alterado. Peça à Take3 um novo link do seu orçamento.'); return; }

  var expirado = d.val && hojeISO() > d.val;
  document.title = 'Orçamento ' + (d.c ? '· ' + d.c : 'Take3 Digital');
  var selo = document.getElementById('selo'); selo.hidden = false;
  if (expirado){ selo.classList.add('exp'); document.getElementById('seloTxt').textContent = 'Expirou em ' + dataBR(d.val); }
  else { document.getElementById('seloTxt').textContent = 'Válido até ' + dataBR(d.val); }

  var lista = function(xs){ return (xs || []).filter(Boolean).map(function(x){ return '<li>' + esc(x) + '</li>'; }).join(''); };
  var proposta = 'index.html' + (d.c ? '?para=' + encodeURIComponent(d.c) : '');
  var html = '' +
    '<section><p class="eyebrow">Proposta comercial · Social</p><h1>Orçamento para <span class="o">' + esc(d.c || 'sua marca') + '</span></h1></section>';
  if (expirado){
    html += '<section class="card aviso"><h1>Este orçamento expirou</h1><p>A validade terminou em ' + dataBR(d.val) + '. Fale com a Take3 para receber um orçamento atualizado.</p></section>';
  } else {
    html += '<div class="grade">' +
      '<section class="card"><p class="tag">O que está incluso</p><h2>' + esc(d.pl) + '</h2><ul>' + lista(d.it) + '</ul></section>' +
      '<section class="card hot"><p class="tag">Investimento</p><div class="valor">' + esc(d.v) + '</div><div class="periodo">' + esc(d.pe) + '</div>' +
        (d.co && d.co.length ? '<div class="div"></div><p class="tag">Condições de pagamento</p><ul>' + lista(d.co) + '</ul>' : '') +
        '<p class="validade">Proposta válida até ' + dataBR(d.val) + '</p></section>' +
      '</div>' +
      (d.o ? '<section class="card"><p class="tag" style="color:var(--yellow)">Observações</p><p class="obs">' + esc(d.o) + '</p></section>' : '');
  }
  html += '<div class="acoes"><a class="btn ghost" href="' + esc(proposta) + '">Ver a apresentação do Social</a></div>' +
    '<footer><span>Take3 Digital · Social media para restaurantes</span><span>Emitido em ' + dataBR(d.em) + '</span></footer>';
  document.getElementById('carregando').outerHTML = html;
})();
</script>
</body>
</html>
